<div id="insertAlbumCarousel${browser_selected_space_id}" class="carousel slide" data-bs-ride="carousel">
	<div class="carousel-inner">
		<#list images_list as image>
		<div class="carousel-item<#if image?index == 0> active</#if>">
			<img src="servlet/plugins/document/resource?id=${image.id}" class="d-block w-100" alt="">
			<div class="carousel-caption"><p>${image.comment}</p></div>
		</div>
		</#list>
	</div>
	<button class="carousel-control-prev" type="button" data-bs-target="#insertAlbumCarousel${browser_selected_space_id}" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">&lsaquo;</span></button>
	<button class="carousel-control-next" type="button" data-bs-target="#insertAlbumCarousel${browser_selected_space_id}" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">&rsaquo;</span></button>
</div>
